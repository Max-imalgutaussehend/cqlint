[package]
name = "cqlint"
description = "A very fast linter and formatter for CQL (Cassandra and ScyllaDB), written in Rust"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Max-imalgutaussehend/cqlint"
homepage = "https://max-imalgutaussehend.github.io/cqlz/cqlint.html"
rust-version = "1.95"
keywords = ["cql", "cassandra", "scylla", "linter", "formatter"]
categories = ["development-tools", "database", "command-line-utilities"]
authors = ["Max-imalgutaussehend"]
readme = "README.md"

[lib]
name = "cqlint"
path = "src/lib.rs"

[[bin]]
name = "cqlint"
path = "src/main.rs"

[dependencies]
cqlc-core = "1.1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
walkdir = "2"
rayon = "1"
anyhow = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
